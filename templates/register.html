
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration - CultivaSense</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

    <div class="login-container">

        <h2>🌱 CultivaSense</h2>
        <h3>Create Your Farmer Account</h3>

        <p>Start your journey towards smarter farming.</p>

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <form id="registerForm" method="POST" action="/register.html">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>

            <label for="location">Farm Location</label>
            <input type="text" id="location" name="location"
                   placeholder="Village, District, State" required>

            <label for="farmSize">Farm Size (in acres)</label>
            <input type="number" id="farmSize" name="farm_size"
                   min="0.01" step="0.01"
                   placeholder="Enter your farm size" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   minlength="8"
                   placeholder="Create a password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirm_password"
                   placeholder="Confirm your password" required>

            <button type="submit">Create Account</button>

        </form>

        <p>Already registered?
            <a href="login.html">Sign In</a>
        </p>

        <a href="index.html">← Back to Home</a>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
